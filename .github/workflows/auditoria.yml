name: Auditoría del repositorio

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  estructura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar arquitectura y enlaces locales
        run: python3 scripts/auditar_repositorio.py
      - name: Tests de PLAA (auditor lógico y argumental)
        run: python3 -m unittest discover -s ai/plaa/tests -p "test_*.py"
      - name: Tests de Quote Audit (auditoría de citas)
        run: python3 -m unittest discover -s ai/quote-audit/tests -p "test_*.py"
